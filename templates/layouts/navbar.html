{{define "navbar"}}
<header class="nav" id="navbar">
  <div class="nav-inner">
    <a class="brand" href="/dashboard" aria-label="RANTAU beranda">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30" fill="none">
          <path d="M4 26 L10 6 L16 26 L22 6 L28 26" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 30 C8 26 12 26 16 30 C20 26 24 26 28 30" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>RANTAU</strong>
        <small>RUMAH MAKAN PADANG</small>
      </span>
    </a>

    <nav class="nav-links" aria-label="Navigasi utama">
      <a href="/dashboard" class="{{if eq .Path `/dashboard`}}active{{end}}">Home</a>
      <a href="/menu" class="{{if eq .Path `/menu`}}active{{end}}">Menu</a>
      <a href="/about" class="{{if eq .Path `/about`}}active{{end}}">About</a>
      <a href="/orders" class="{{if eq .Path `/orders`}}active{{end}}">Orders</a>
      <a href="/favorites" class="{{if eq .Path `/favorites`}}active{{end}}">Favorites</a>
    </nav>

    <div class="nav-actions">
      <button class="icon-btn" id="searchToggle" aria-label="Cari menu" title="Cari menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn cart-btn" id="cartOpen" aria-label="Buka pesanan" title="Pesanan">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.8h7.7a2 2 0 0 0 2-1.6L20.6 8H6"/><circle cx="9.5" cy="21" r="1.3"/><circle cx="16.5" cy="21" r="1.3"/></svg>
        <span class="badge" id="cartBadge" {{if not .CartCount}}hidden{{end}}>{{.CartCount}}</span>
      </button>

      <div class="account">
        <button class="icon-btn acct-btn" id="acctToggle" aria-haspopup="true" aria-label="Akun">
          <span class="avatar avatar-sm">{{initial .User.Name}}</span>
        </button>
        <div class="dropdown" id="acctMenu">
          <div class="dropdown-head">
            <strong>{{.User.Name}}</strong>
            <span>{{.User.Email}}</span>
          </div>
          <a href="/profile">Profil</a>
          <a href="/orders">Pesanan Saya</a>
          <a href="/favorites">Favorit</a>
          {{if eq .User.Role "admin"}}<a href="/admin">Admin Panel</a>{{end}}
          <form method="POST" action="/logout" class="dropdown-form">
            <input type="hidden" name="csrf_token" value="{{.CSRF}}">
            <button type="submit" class="danger">Keluar</button>
          </form>
        </div>
      </div>

      <button class="icon-btn theme-btn" id="themeToggle" aria-label="Ganti tema">
        <span class="sun" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
        <span class="moon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </span>
      </button>
    </div>
  </div>

  <div class="search-overlay" id="searchOverlay" hidden>
    <form class="search-bar" action="/menu" method="get" role="search">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="searchInput" name="q" placeholder="Mau makan apa hari ini?" autocomplete="off" aria-label="Cari menu">
      <button class="search-go" type="submit">Cari</button>
    </form>
    <div class="search-suggest" id="searchSuggest"></div>
  </div>
</header>
{{end}}
