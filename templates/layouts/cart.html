{{define "cartdrawer"}}
<div class="drawer-scrim" id="cartScrim" hidden></div>
<aside class="drawer" id="cartDrawer" aria-label="Pesanan anda" aria-hidden="true">
  <header class="drawer-head">
    <h3>PESANAN ANDA</h3>
    <button class="icon-btn" id="cartClose" aria-label="Tutup pesanan">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>
  <div class="drawer-body" id="cartDrawerBody">
    <div class="cart-empty">
      <svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.8h7.7a2 2 0 0 0 2-1.6L20.6 8H6"/><circle cx="9.5" cy="21" r="1.3"/><circle cx="16.5" cy="21" r="1.3"/></svg>
      <p>Belum ada pesanan.</p>
      <p class="muted">Yuk pilih menu favoritmu dulu.</p>
      <a href="/menu" class="btn btn-primary btn-sm">Lihat Menu</a>
    </div>
  </div>
  <footer class="drawer-foot" id="cartDrawerFoot" hidden>
    <div class="row between cart-sum">
      <span>Subtotal</span>
      <strong id="cartDrawerTotal">Rp 0</strong>
    </div>
    <a href="/checkout" class="btn btn-primary w100" id="cartCheckout">LANJUT KE CHECKOUT</a>
  </footer>
</aside>
{{end}}

{{define "mobileNav"}}
<nav class="mobile-nav" aria-label="Navigasi bawah">
  <a href="/dashboard" class="{{if eq .Path `/dashboard`}}active{{end}}">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    <span>Home</span>
  </a>
  <a href="/menu" class="{{if eq .Path `/menu`}}active{{end}}">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16M4 6h16M4 18h10"/></svg>
    <span>Menu</span>
  </a>
  <a href="/favorites" class="{{if eq .Path `/favorites`}}active{{end}}">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21C7 17 3 13.5 3 9.3 3 6.4 5.2 4 8 4c1.6 0 3.1.8 4 2 .9-1.2 2.4-2 4-2 2.8 0 5 2.4 5 5.3C21 13.5 17 17 12 21Z"/></svg>
    <span>Favorit</span>
  </a>
  <button class="mn-item" id="mnCartOpen" aria-label="Pesanan">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.8h7.7a2 2 0 0 0 2-1.6L20.6 8H6"/><circle cx="9.5" cy="21" r="1.3"/><circle cx="16.5" cy="21" r="1.3"/></svg>
    <span>Cart</span>
  </button>
  <a href="/profile" class="{{if eq .Path `/profile`}}active{{end}}">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
    <span>Akun</span>
  </a>
</nav>
{{end}}
